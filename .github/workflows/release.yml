name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/civicpulse

jobs:
  build-push-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_BASE }}/backend:${{ github.sha }}
          cache-from: type=gha

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }}
          cache-from: type=gha

      - name: Generate release notes and publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: CivicPulse ${{ github.ref_name }}
