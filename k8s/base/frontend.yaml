apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: civicpulse
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: civicpulse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: frontend
          image: ghcr.io/schwifty101/civicpulse/frontend:dev  # overlays pin the real SHA/digest
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 3"] }
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
