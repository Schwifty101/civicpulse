# Requires an ingress-nginx controller installed in the cluster (see docs/RUNBOOK.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse
  namespace: civicpulse
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: civicpulse.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
