# Runs as the non-root `nginx` user, so it listens on 8080 rather than the
# privileged port 80 (see Dockerfile). This is what gives CivicPulse
# build-once-deploy-many for the frontend: no absolute backend URL is ever
# baked into the JS bundle — every backend call is a same-origin /api/...
# request that this proxy forwards to the `backend` Service, whatever
# environment (dev compose, prod compose, k8s) resolves that name to.
# See docs/adr/0002-frontend-runtime-config.md.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }
}
